name: Release

# Tagging is the trigger: `git tag v0.1.1 && git push origin v0.1.1`.
# `workflow_dispatch` re-cuts a release without moving a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.1 (defaults to the ref name)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # One native build per target. MoonBit's native backend goes through the
  # system C compiler, so each target is built on its own runner rather than
  # cross-compiled.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are linked fully statically against musl so they
          # run on any distribution regardless of its glibc version. A glibc
          # build would bake in the runner's symbol versions and refuse to
          # start on older systems ("GLIBC_2.38 not found").
          - runner: ubuntu-latest
            target: linux-x86_64
            musl: true
          # GitHub's arm64 Linux runners are only available to public
          # repositories. Remove this entry if that is a problem.
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            musl: true
          - runner: macos-15
            target: darwin-aarch64
            musl: false
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # A fresh runner has an empty registry index, so dependencies
      # (moonbitlang/x, moonbitlang/async, ...) cannot be resolved until the
      # index is fetched.
      - name: Update registry index
        run: moon update

      # The MoonBit runtime's arm64 simdutf.o is compiled against glibc
      # headers and references `__memcpy_chk`; musl provides no `*_chk`
      # fortify symbols, so link a small shim supplying them.
      - name: Build fortify shim (glibc *_chk for musl)
        if: matrix.musl
        run: |
          mkdir -p /tmp/podcomp-cc
          cat > /tmp/podcomp-cc/fortify_shim.c <<'EOF'
          #include <string.h>
          #include <stdarg.h>
          #include <stdio.h>
          void *__memcpy_chk(void *d, const void *s, size_t n, size_t dn) { (void)dn; return memcpy(d, s, n); }
          void *__memmove_chk(void *d, const void *s, size_t n, size_t dn) { (void)dn; return memmove(d, s, n); }
          void *__memset_chk(void *d, int c, size_t n, size_t dn) { (void)dn; return memset(d, c, n); }
          char *__strcpy_chk(char *d, const char *s, size_t dn) { (void)dn; return strcpy(d, s); }
          char *__stpcpy_chk(char *d, const char *s, size_t dn) { (void)dn; return stpcpy(d, s); }
          char *__strcat_chk(char *d, const char *s, size_t dn) { (void)dn; return strcat(d, s); }
          char *__strncpy_chk(char *d, const char *s, size_t n, size_t dn) { (void)dn; return strncpy(d, s, n); }
          char *__strncat_chk(char *d, const char *s, size_t n, size_t dn) { (void)dn; return strncat(d, s, n); }
          int __sprintf_chk(char *s, int flag, size_t slen, const char *fmt, ...) { (void)flag; (void)slen; va_list ap; va_start(ap, fmt); int r = vsprintf(s, fmt, ap); va_end(ap); return r; }
          int __vsprintf_chk(char *s, int flag, size_t slen, const char *fmt, va_list ap) { (void)flag; (void)slen; return vsprintf(s, fmt, ap); }
          int __snprintf_chk(char *s, size_t n, int flag, size_t slen, const char *fmt, ...) { (void)flag; (void)slen; va_list ap; va_start(ap, fmt); int r = vsnprintf(s, n, fmt, ap); va_end(ap); return r; }
          int __vsnprintf_chk(char *s, size_t n, int flag, size_t slen, const char *fmt, va_list ap) { (void)flag; (void)slen; return vsnprintf(s, n, fmt, ap); }
          int __printf_chk(int flag, const char *fmt, ...) { (void)flag; va_list ap; va_start(ap, fmt); int r = vprintf(fmt, ap); va_end(ap); return r; }
          int __vprintf_chk(int flag, const char *fmt, va_list ap) { (void)flag; return vprintf(fmt, ap); }
          int __fprintf_chk(FILE *f, int flag, const char *fmt, ...) { (void)flag; va_list ap; va_start(ap, fmt); int r = vfprintf(f, fmt, ap); va_end(ap); return r; }
          int __vfprintf_chk(FILE *f, int flag, const char *fmt, va_list ap) { (void)flag; return vfprintf(f, fmt, ap); }
          EOF
          musl-gcc -O2 -c /tmp/podcomp-cc/fortify_shim.c -o /tmp/podcomp-cc/fortify_shim.o
          ar rcs /tmp/podcomp-cc/libpodcompfortify.a /tmp/podcomp-cc/fortify_shim.o

      # MOON_CC drives both the compile and the link step. The wrapper adds
      # `-static`, and `moon` looks for `ar` next to the compiler driver, so
      # the wrapper directory gets a symlink to the system `ar`. Link
      # invocations also get the fortify shim; compile invocations (`-c`) are
      # passed through untouched.
      - name: Build (static musl, release)
        if: matrix.musl
        run: |
          cat > /tmp/podcomp-cc/podcomp-musl-gcc <<'EOF'
          #!/bin/sh
          for arg in "$@"; do
            if [ "$arg" = "-c" ]; then
              exec musl-gcc "$@"
            fi
          done
          exec musl-gcc "$@" -static -L/tmp/podcomp-cc -lpodcompfortify
          EOF
          chmod +x /tmp/podcomp-cc/podcomp-musl-gcc
          ln -sf "$(command -v ar)" /tmp/podcomp-cc/ar
          MOON_CC=/tmp/podcomp-cc/podcomp-musl-gcc MOON_AR=ar moon build --target native --release
          mkdir -p dist
          cp _build/native/release/build/cmd/main/main.exe "dist/podcomp-${{ matrix.target }}"
          chmod 755 "dist/podcomp-${{ matrix.target }}"

      - name: Build (release)
        if: ${{ !matrix.musl }}
        run: |
          moon build --target native --release
          mkdir -p dist
          cp _build/native/release/build/cmd/main/main.exe "dist/podcomp-${{ matrix.target }}"
          chmod 755 "dist/podcomp-${{ matrix.target }}"

      # Only two assets per target: the binary and its checksum. Both the
      # npm launcher and install.sh fetch the bare asset and set the mode
      # themselves, so an archive would be a third thing to keep in sync and
      # nothing would read it.
      - name: Stage assets
        run: |
          set -eu
          asset="podcomp-${{ matrix.target }}"
          file "dist/$asset" || true
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256" 2>/dev/null \
            || sha256sum "$asset" > "$asset.sha256")
          ls -l dist

      # Sanity check: Linux assets must be fully static or they would carry a
      # glibc version requirement and fail on older distributions.
      - name: Verify Linux binary is statically linked
        if: matrix.musl
        run: |
          file "dist/podcomp-${{ matrix.target }}"
          if ! file "dist/podcomp-${{ matrix.target }}" | grep -q "statically linked"; then
            echo "error: podcomp-${{ matrix.target }} is not statically linked" >&2
            exit 1
          fi

      - name: Smoke test
        run: |
          set -eu
          "./dist/podcomp-${{ matrix.target }}" --version
          "./dist/podcomp-${{ matrix.target }}" --help >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: podcomp-${{ matrix.target }}
          path: |
            dist/podcomp-${{ matrix.target }}
            dist/podcomp-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -l dist

      - name: Resolve tag
        id: tag
        run: |
          set -eu
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' moon.mod)"
          fi
          case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  # The npm package is a launcher, not a bundle: it downloads the matching
  # release asset on first run. Publishing after the release job guarantees the
  # asset exists before the first user pulls it.
  npm:
    name: publish @tomasko/podcomp
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the package version matches the release
        working-directory: npmjs
        run: |
          set -eu
          WANT="${{ needs.release.outputs.tag }}"
          WANT="${WANT#v}"
          HAVE="$(node -p "require('./package.json').version")"
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::npmjs/package.json is $HAVE but the release tag is $WANT"
            exit 1
          fi

      - name: Publish
        working-directory: npmjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured; skipping the npm publish."
            exit 0
          fi
          npm publish --access public --provenance
