name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: check, format and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The version is written down three times. Nothing else notices when the
      # copies drift, and a stale one ships in the release assets, so compare
      # them with plain `sed` (no toolchain or Node needed).
      - name: Versions agree
        run: |
          set -eu
          mod="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' moon.mod)"
          src="$(sed -n 's/^pub let version : String = "\(.*\)"/\1/p' podcomp.mbt)"
          npm="$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)".*/\1/p' npmjs/package.json)"
          printf 'moon.mod=%s source=%s npm=%s\n' "$mod" "$src" "$npm"
          test -n "$mod"
          test "$mod" = "$src"
          test "$mod" = "$npm"

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check (warnings are errors)
        run: moon check --target native --deny-warn

      # `moon fmt` chooses its canonical backend itself and formats for
      # wasm-gc regardless of `preferred_target`, which the module sets to
      # native. The formatter therefore rewrites `Int` to `Int32` — including
      # in packages marked `supported_targets = "+native"` — and a hard gate
      # would fail on a difference that is not this project's to fix. Nor can
      # the toolchain be pinned around it: the installer serves only `latest`
      # and older versions are dropped from the CDN. So report, do not block;
      # `--deny-warn` and the tests below are the gates that do block.
      - name: Format check (advisory)
        run: |
          if moon fmt --check; then
            echo "::notice title=moon fmt::no formatting differences"
          else
            echo "::warning title=moon fmt::differences reported above; not failing the build"
          fi

      - name: Test
        run: moon test --target native

      # `y_dump` has to reproduce `yaml.safe_dump` byte for byte, and the
      # fixtures the MoonBit test replays are generated from PyYAML. Recompute
      # them here so they cannot drift from the reference unnoticed.
      - name: YAML dump fixtures match PyYAML
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-yaml
          python3 scripts/check-yaml-dump.py --check

      - name: Build the executable
        run: moon build --target native

      # The binary only shells out to podman, so a smoke test needs no daemon:
      # `--help` and `--version` exercise the CLI parser and the version path.
      - name: Smoke test
        run: |
          set -eu
          BIN=_build/native/debug/build/cmd/main/main.exe
          "$BIN" --version
          "$BIN" --help >/dev/null
          "$BIN" version | grep -q "podcomp version"

  shellcheck:
    name: lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck install.sh scripts/*.sh

  npm:
    name: lint the npm wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Check every script the package ships, so adding one cannot silently
      # leave the check pointing at a file that no longer exists.
      - name: Syntax check
        run: |
          set -eu
          find npmjs -name '*.js' -not -path '*/node_modules/*' -print0 |
            while IFS= read -r -d '' script; do
              echo "node --check $script"
              node --check "$script"
            done
      - name: Unit tests
        working-directory: npmjs
        run: node --test
